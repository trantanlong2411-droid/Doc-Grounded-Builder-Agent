name: Doc-Grounded Builder — deployed Worker proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live published site and three actual Docs + Chain MCP sequences
        run: node scripts/verify-deployed.mjs
